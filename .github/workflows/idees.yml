# Claude cherche un sujet (ou prend le tien), vérifie les faits et écrit le script à enregistrer.
name: Idée + script
on:
  # Lancé de l'extérieur par cron-job.org (heure de Paris), deux fois par jour : 10h17 et 22h17.
  #   POST https://api.github.com/repos/Auracontent/studio-anime/actions/workflows/idees.yml/dispatches
  #   body {"ref":"main","inputs":{"voix_auto":"true"}}  -> script, puis voix Gemini, puis la vidéo (video.yml) s'enchaînent.
  # Plus de « schedule: » GitHub (en retard ou sauté, et doublerait les lancements de cron-job.org).
  workflow_dispatch:
    inputs:
      sujet: { description: "Sujet (laisser vide : Claude choisit le plus viral)", required: false }
      voix_auto: { description: "Générer la voix avec Gemini TTS et lancer la vidéo directement", type: boolean, default: false }
permissions: { contents: write, issues: write, id-token: write, actions: write }
jobs:
  script:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 100 }
      - name: Already done? (scheduled runs only)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && \
             [ -n "$(git log --since='20 hours ago' --grep='^Add script' --format=%h)" ]; then
            echo "A script was already added in the last 20 hours: nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"
          else echo "skip=false" >> "$GITHUB_OUTPUT"; fi
      - name: Trends from reference channels (YouTube Data API, public metadata only)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env: { YOUTUBE_API_KEY: "${{ secrets.YOUTUBE_API_KEY }}" }
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then echo "No YOUTUBE_API_KEY secret: skipping trends."; exit 0; fi
          python3 tools/trends.py --out trends.md
      - name: Our own numbers (what works on our channel)
        if: ${{ steps.guard.outputs.skip != 'true' }}
        env: { YOUTUBE_API_KEY: "${{ secrets.YOUTUBE_API_KEY }}", YT_CLIENT_ID: "${{ secrets.YT_CLIENT_ID }}", YT_CLIENT_SECRET: "${{ secrets.YT_CLIENT_SECRET }}", YT_REFRESH_TOKEN: "${{ secrets.YT_REFRESH_TOKEN }}" }
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then echo "No YOUTUBE_API_KEY secret: skipping our stats."; exit 0; fi
          python3 tools/mystats.py --out stats.md || echo "stats failed: the generator goes on without them"
      - if: ${{ steps.guard.outputs.skip != 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 60 --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
          prompt: |
            Lis CLAUDE.md (sections « Deux formats » et « Idées et scripts ») et SKILL.md. Sujet demandé : « ${{ github.event.inputs.sujet }} ».
            0) NOS CHIFFRES. Si stats.md existe, lis-le d'abord et applique la section « Nos chiffres » de CLAUDE.md : il dit ce qui marche
               sur NOTRE chaîne (il prime sur trends.md). Note dans NOTES.md une ligne « Chiffres : » qui dit ce que tu en as retenu.
            1) FORMAT. Un sujet demandé fixe le format. Sinon, regarde la ligne « Format : » du NOTES.md le plus récent dans inbox/
               (pas de ligne = « Histoire vraie ») et prends l'AUTRE format : « Histoire vraie » <-> « Vie quotidienne ».
            2) SUJET.
               - « Histoire vraie » : s'il n'y a pas de sujet demandé, ouvre sujets.md : prends le PREMIER sujet non coché (`- [ ] ...`,
                 ligne non vide), puis coche-le (`- [x] ... -> inbox/<slug>`). Si la liste est vide : si trends.md existe, applique la section
                 « Tendances » de CLAUDE.md ; sinon choisis toi-même le sujet le plus viral. Évite ce qui est déjà dans episodes/.
                 Vérifie les faits sur le web.
               - « Vie quotidienne » : invente une petite histoire du quotidien, émotionnelle, avec une leçon qui parle au spectateur
                 (fiction, jamais présentée comme vraie ; règles de la section « Deux formats »). Ne touche pas à sujets.md.
            3) Applique la section « Diversité des sujets » de CLAUDE.md (sauf si le sujet t'est imposé). Écris un script de 40 à 50 s en français (110 à 130 mots, jamais une date ni du contexte en premier, une action qu'on peut montrer par phrase, fin qui reboucle sur le début) : inbox/<AAAA-MM-JJ>-<mot-clé>/script.txt et NOTES.md (ligne « Format : … », sources pour une histoire vraie, plan visuel phrase par phrase avec l'action visible, l'ambiance et l'effet, l'image d'accroche des 2 premières secondes, le héros, titre proposé).
            Commite et pousse (git add inbox sujets.md trends.md trends.json stats.md stats.json ; git commit -m "Add script <slug>" ; git pull --rebase ; git push).
            Voix automatique pour ce lancement : ${{ (github.event_name == 'schedule' || github.event.inputs.voix_auto == 'true') && 'OUI' || 'NON' }}.
            Si c'est OUI, n'ouvre PAS d'issue : la voix et la vidéo suivent toutes seules.
            Si c'est NON, ouvre une issue avec `gh issue create` : titre « Script : <titre> », corps = le script dans un bloc de code,
            puis « Enregistre-le avec la voix Riko (Google AI Studio) et dépose voice.wav dans inbox/<slug>/ »
            (elle sera fermée automatiquement quand la vidéo sera prête).
            Écris le slug choisi dans le fichier /tmp/slug.
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Voix automatique (facultatif)
        if: ${{ steps.guard.outputs.skip != 'true' && (github.event_name == 'schedule' || github.event.inputs.voix_auto == 'true') }}
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          git pull -q; S=$(cat /tmp/slug)
          if [ -z "$GEMINI_API_KEY" ] || [ ! -f brand/voice.json ]; then
            echo "Pas de voix automatique (secret GEMINI_API_KEY ou brand/voice.json manquant) : le script t'attend dans l'issue."; exit 0; fi
          python3 tools/tts.py inbox/$S/script.txt inbox/$S/voice.wav
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/$S/voice.wav && git commit -m "Add TTS voice for $S" && { for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; echo "push retry $i"; sleep $((i*5)); done; }
          gh workflow run video.yml -f slug=$S      # un push fait par le bot ne déclenche pas les workflows : on lance la vidéo à la main
