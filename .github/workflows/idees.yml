# Claude cherche un sujet (ou prend le tien), vérifie les faits et écrit le script à enregistrer.
name: Idée + script
on:
  # Lundi, mercredi, vendredi à 7 h 17 (heure de Paris en hiver ; le cron est en UTC). Change la ligne pour un autre rythme.
  # Par cron : Claude choisit le sujet, et si GEMINI_API_KEY + brand/voice.json existent, la voix et la vidéo suivent seules.
  schedule:
    - cron: '17 6 * * 1,3,5'
  workflow_dispatch:
    inputs:
      sujet: { description: "Sujet (laisser vide : Claude choisit le plus viral)", required: false }
      voix_auto: { description: "Générer la voix avec Gemini TTS et lancer la vidéo directement", type: boolean, default: false }
permissions: { contents: write, issues: write, id-token: write, actions: write }
jobs:
  script:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Trends from reference channels (YouTube Data API, public metadata only)
        env: { YOUTUBE_API_KEY: "${{ secrets.YOUTUBE_API_KEY }}" }
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then echo "No YOUTUBE_API_KEY secret: skipping trends."; exit 0; fi
          python3 tools/trends.py --out trends.md
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 60 --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
          prompt: |
            Lis CLAUDE.md (section « Idées et scripts ») et SKILL.md. Sujet demandé : « ${{ github.event.inputs.sujet }} ».
            S'il est vide, ouvre sujets.md : prends le PREMIER sujet non coché (`- [ ] ...`, ligne non vide), puis coche-le
            (`- [x] ... -> inbox/<slug>`). Si la liste n'a aucun sujet non coché : si trends.md existe,
            lis-le et applique la section « Tendances » de CLAUDE.md (repérer les familles de thèmes qui font le plus de vues, puis trouver
            TA propre histoire dans la meilleure famille) ; sinon choisis toi-même le sujet le plus viral. Évite ce qui est déjà dans episodes/
            (fait vrai, surprenant, visuel, idéalement un lieu ou une invention française).
            Vérifie les faits sur le web.
            Applique la section « Diversité des sujets » de CLAUDE.md (sauf si le sujet t'est imposé). Écris un script de 45 à 60 s en français : inbox/<AAAA-MM-JJ>-<mot-clé>/script.txt et NOTES.md (sources, plan visuel, titre proposé).
            Commite et pousse (git add inbox sujets.md trends.md trends.json ; git commit -m "Add script <slug>" ; git pull --rebase ; git push).
            Puis ouvre une issue avec `gh issue create` : titre « Script : <titre> », corps = le script dans un bloc de code,
            puis « Enregistre-le avec la voix Riko (Google AI Studio) et dépose voice.wav dans inbox/<slug>/ ».
            Écris le slug choisi dans le fichier /tmp/slug.
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Voix automatique (facultatif)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.voix_auto == 'true' }}
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          git pull -q; S=$(cat /tmp/slug)
          if [ -z "$GEMINI_API_KEY" ] || [ ! -f brand/voice.json ]; then
            echo "Pas de voix automatique (secret GEMINI_API_KEY ou brand/voice.json manquant) : le script t'attend dans l'issue."; exit 0; fi
          python3 tools/tts.py inbox/$S/script.txt inbox/$S/voice.wav
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inbox/$S/voice.wav && git commit -m "Add TTS voice for $S" && { for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; echo "push retry $i"; sleep $((i*5)); done; }
          gh workflow run video.yml -f slug=$S      # un push fait par le bot ne déclenche pas les workflows : on lance la vidéo à la main
