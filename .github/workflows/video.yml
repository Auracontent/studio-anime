# Voix + script déposés dans inbox/<slug>/  ->  Claude réalise l'épisode  ->  rendu en parallèle  ->  MP4 sur Hugging Face.
name: Vidéo
on:
  push:
    paths: ['inbox/**/voice.*']
  workflow_dispatch:
    inputs:
      slug: { description: "Dossier dans inbox/ (ex. 2026-11-20-tour-eiffel)", required: true }
      redirect: { description: "Refaire aussi la réalisation d'un épisode existant (sinon : automatique)", type: boolean, default: false }
permissions: { contents: write, issues: write, id-token: write, actions: read }
concurrency: { group: "video-${{ github.event.inputs.slug || github.sha }}", cancel-in-progress: false }
env: { CHROME: /usr/bin/google-chrome, CHUNKS: 8 }

jobs:
  direct:
    name: Réalisation (Claude)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs: { slug: "${{ steps.slug.outputs.slug }}", direct: "${{ steps.slug.outputs.direct }}" }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Voix automatique si le script n'en a pas (Gemini TTS, voix de la chaîne)
        if: ${{ github.event.inputs.slug != '' }}
        env: { GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: |
          S="${{ github.event.inputs.slug }}"
          if [ -f "inbox/$S/script.txt" ] && ! ls inbox/$S/voice.* >/dev/null 2>&1 && [ ! -f "episodes/$S/voice.wav" ]; then
            [ -n "$GEMINI_API_KEY" ] || { echo "Pas de voix et pas de GEMINI_API_KEY"; exit 1; }
            python3 tools/tts.py inbox/$S/script.txt inbox/$S/voice.wav
            git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add inbox/$S/voice.wav && git commit -m "Add TTS voice for $S" && { for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; echo "push retry $i"; sleep $((i*5)); done; }
          else echo "Voix déjà présente (ou pas de script) : rien à générer."; fi
      - id: slug
        name: Trouver l'épisode
        run: |
          S="${{ github.event.inputs.slug }}"
          if [ -z "$S" ]; then S=$(git diff --name-only HEAD~1 HEAD | grep -E '^inbox/[^/]+/voice\.' | head -1 | cut -d/ -f2); fi
          [ -n "$S" ] || { echo "aucune voix trouvée dans inbox/"; exit 1; }
          # Décision automatique : réaliser si l'épisode n'existe pas encore, ou si une nouvelle voix vient d'être déposée,
          # ou si on le demande (redirect) ; sinon l'épisode est déjà écrit -> rendu seulement.
          D=false
          if [ ! -f "episodes/$S/meta.json" ] || [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.redirect }}" = "true" ]; then D=true; fi
          if [ "$D" = true ] && ! ls inbox/$S/voice.* >/dev/null 2>&1 && [ ! -f "episodes/$S/voice.wav" ]; then echo "pas de voix pour $S"; exit 1; fi
          echo "slug=$S" >> "$GITHUB_OUTPUT"; echo "direct=$D" >> "$GITHUB_OUTPUT"
          echo "Épisode : $S — $([ $D = true ] && echo 'réalisation par Claude + rendu' || echo 'déjà réalisé : rendu seulement')"
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu >/dev/null
          pip install --quiet numpy pillow faster-whisper
          bash tools/setup.sh
      - name: Claude réalise l'épisode
        if: ${{ steps.slug.outputs.direct == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # "Idée + script" starts this workflow itself (gh workflow run), so the actor is the github-actions bot.
          # Only that bot is allowed, not every bot.
          allowed_bots: "github-actions,github-actions[bot]"
          claude_args: "--max-turns 200 --allowedTools Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"
          prompt: |
            Tu es le réalisateur du studio. Lis CLAUDE.md puis SKILL.md, et fabrique l'épisode `${{ steps.slug.outputs.slug }}`
            à partir de `inbox/${{ steps.slug.outputs.slug }}/` (ou, s'il n'y a pas de dossier inbox, refais la réalisation de
            `episodes/${{ steps.slug.outputs.slug }}/` existant en gardant sa voix) en suivant les étapes 2 à 9 de CLAUDE.md
            (setup déjà fait, CHROME=/usr/bin/google-chrome). Le contrôle images fixes est obligatoire : lis la planche et corrige
            jusqu'à ce qu'elle soit propre, surtout la taille des personnages (frameOn, tête ~30 % de la largeur).
            Ne lance PAS le rendu complet. Termine par : git add episodes/${{ steps.slug.outputs.slug }} ;
            git commit -m "Add episode ${{ steps.slug.outputs.slug }}" ; git pull --rebase ; git push.
            Si quelque chose bloque (voix illisible, script absent), écris le problème dans episodes/${{ steps.slug.outputs.slug }}/PROBLEME.md, commite et arrête-toi.
      - name: Vérifier
        run: |
          git pull -q --rebase || git pull -q
          E=episodes/${{ steps.slug.outputs.slug }}
          [ -f $E/PROBLEME.md ] && { cat $E/PROBLEME.md; exit 1; } || true
          for f in voice.wav words.json web/story.js web/world.js audio.py meta.json; do [ -f $E/$f ] || { echo "manque $E/$f"; exit 1; }; done
          echo "OK : $(python3 -c "import json;print(json.load(open('$E/meta.json'))['total'])") images"

  render:
    name: Rendu ${{ matrix.part }}/8
    needs: direct
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy: { fail-fast: true, matrix: { part: [0, 1, 2, 3, 4, 5, 6, 7] } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - run: git pull -q
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bash tools/setup.sh
      - name: Rendre une tranche
        run: |
          E=episodes/${{ needs.direct.outputs.slug }}
          N=$(python3 -c "import json;print(json.load(open('$E/meta.json'))['total'])")
          A=$(( N * ${{ matrix.part }} / CHUNKS )); B=$(( N * (${{ matrix.part }} + 1) / CHUNKS - 1 ))
          echo "images $A-$B sur $N"; node tools/render.mjs $E frames "$A-$B"
      - uses: actions/upload-artifact@v4
        with: { name: "frames-${{ matrix.part }}", path: frames/, retention-days: 1 }

  finish:
    name: Finition + Hugging Face
    needs: [direct, render]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - run: git pull -q
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install --quiet numpy pillow
          mkdir -p ~/.fonts && cp assets/fonts/*.ttf ~/.fonts/ && fc-cache -f >/dev/null
      - uses: actions/download-artifact@v4
        with: { pattern: "frames-*", path: frames, merge-multiple: true }
      - name: Son, sous-titres, encodage, contrôle
        run: |
          E=episodes/${{ needs.direct.outputs.slug }}
          T=$(python3 -c "import json;print(json.load(open('$E/meta.json'))['title'])")
          echo "$(ls frames | wc -l) images"; bash tools/finish.sh $E frames "$T" | tee qa.txt
      - name: Déposer sur Hugging Face (dataset soradata/studio-anime, dossier <slug>/)
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}", HF_DATASET: "${{ vars.HF_DATASET || 'soradata/studio-anime' }}" }
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "Secret HF_TOKEN missing: the video cannot be stored (no Release anymore)."; exit 1; fi
          pip install --quiet "huggingface_hub[hf_xet]"
          python3 tools/hf_upload.py episodes/${{ needs.direct.outputs.slug }}
      - uses: actions/upload-artifact@v4
        with: { name: "video-${{ needs.direct.outputs.slug }}", path: "episodes/${{ needs.direct.outputs.slug }}/out/", retention-days: 3 }
