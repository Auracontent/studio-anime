# Publishes the oldest "ready" video from Hugging Face (soradata/studio-anime) to YouTube + TikTok through Zernio.
# One video per run, launched twice a day by cron-job.org. A GitHub schedule (none left) would only publish if PUBLISH_ENABLED is "true"
# (Settings -> Secrets and variables -> Actions -> Variables), so nothing goes out before you have tested it.
name: Publication
on:
  # Launched from cron-job.org (Paris time), twice a day: 12:07 and 19:07.
  #   POST https://api.github.com/repos/Auracontent/studio-anime/actions/workflows/publier.yml/dispatches
  #   body {"ref":"main","inputs":{"mode":"publier"}}  -> publishes the oldest ready video (one per run).
#   Midday run (before 15:00 Paris) prefers an "Histoire vraie", evening run a "Vie quotidienne" (tools/publish.py, PUBLISH_FORMAT).
  # Videos with a grave QA defect get status "review" (see out/QA.md on Hugging Face) and are skipped; to publish one anyway
  # after checking it, run this workflow by hand with mode = publier and slug = <slug>.
  # To pause publishing, disable those jobs in cron-job.org (PUBLISH_ENABLED only applies to GitHub schedules, none left).
  workflow_dispatch:
    inputs:
      mode:
        description: "test = show what would be sent | publier = publish for real | comptes = list Zernio account ids"
        type: choice
        options: [test, publier, comptes]
        default: test
      slug: { description: "Specific video (empty = oldest ready one)", required: false }
permissions: { contents: read }
concurrency: { group: publication, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY || secrets.ZERNIO_API_KEY_P }}
      ZERNIO_YOUTUBE_ACCOUNT_ID: ${{ secrets.ZERNIO_YOUTUBE_ACCOUNT_ID || secrets.YOUTUBE_ID_COUNT_P || vars.ZERNIO_YOUTUBE_ACCOUNT_ID }}
      ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets.ZERNIO_TIKTOK_ACCOUNT_ID || secrets.TIKTOK_ID_COUNT_P || vars.ZERNIO_TIKTOK_ACCOUNT_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET: ${{ vars.HF_DATASET || 'soradata/studio-anime' }}
      TIKTOK_PRIVACY: ${{ vars.TIKTOK_PRIVACY || 'PUBLIC_TO_EVERYONE' }}
      YOUTUBE_VISIBILITY: ${{ vars.YOUTUBE_VISIBILITY || 'public' }}
      PUBLISH_AI_LABEL: ${{ vars.PUBLISH_AI_LABEL || '1' }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide
        id: mode
        run: |
          M="${{ github.event.inputs.mode }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "${{ vars.PUBLISH_ENABLED }}" != "true" ]; then echo "PUBLISH_ENABLED is not 'true': automatic publishing is off."; M=off; else M=publier; fi
          fi
          if [ -z "$ZERNIO_API_KEY" ] && [ "$M" != off ] && [ "$M" != test ]; then echo "Secret ZERNIO_API_KEY missing."; exit 1; fi
          echo "mode=$M" >> "$GITHUB_OUTPUT"; echo "Mode: $M"
      - name: Publish
        if: ${{ steps.mode.outputs.mode != 'off' }}
        run: |
          pip install --quiet ".[upload]"
          A=""; [ -n "${{ github.event.inputs.slug }}" ] && A="--slug ${{ github.event.inputs.slug }}"
          case "${{ steps.mode.outputs.mode }}" in
            comptes) python3 tools/publish.py --list-accounts ;;
            test)    python3 tools/publish.py --dry-run $A ;;
            publier) python3 tools/publish.py $A ;;
          esac
      - name: Channel upkeep (playlists, series comments, home page)
        if: ${{ steps.mode.outputs.mode == 'publier' }}
        env: { YT_CLIENT_ID: "${{ secrets.YT_CLIENT_ID }}", YT_CLIENT_SECRET: "${{ secrets.YT_CLIENT_SECRET }}", YT_REFRESH_TOKEN: "${{ secrets.YT_REFRESH_TOKEN }}" }
        run: python3 tools/yt_channel.py --setup || true
